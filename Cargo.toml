[workspace]
members = [
    "crates/zentop-core",
    "crates/zentop-gui",
    "crates/zentop-tui",
    "crates/zentop-cli",
]
default-members = ["crates/zentop-gui"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Amjad Hossain"]
repository = "https://github.com/amjadjibon/zentop"

[workspace.dependencies]
zentop-core = { path = "crates/zentop-core" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# Sample processes sequentially to avoid contention between parallel syscalls.
sysinfo = { version = "0.35.2", features = ["disk", "network", "system"] }

[profile.release]
panic = "abort"            # Strip expensive panic clean-up logic
codegen-units = 1          # Compile crates one after another so the compiler can optimize better
lto = "fat"                # More aggressive link-time optimization
opt-level = 3              # Optimize for maximum performance
strip = true               # Remove debug symbols
incremental = false         # Disable incremental compilation
