[package]
name = "zentop"
version = "1.3.0"
description = "A cross-platform system monitor"
authors = ["Abdenasser"]
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "Zentop"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9"
dirs = "6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
sysinfo = { version = "0.35.2", features = ["disk", "multithread", "network", "system"] }
listeners = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
unicode-normalization = "0.1"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }

[profile.release]
panic = "abort"            # Strip expensive panic clean-up logic
codegen-units = 1          # Compile crates one after another so the compiler can optimize better
lto = "fat"                # More aggressive link-time optimization
opt-level = 3              # Optimize for maximum performance
strip = true               # Remove debug symbols
incremental = false         # Disable incremental compilation

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
file_icon_provider = "=1.0.2"
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"
# The tray icon needs a GTK main loop of its own (matches tray-icon's GTK).
gtk = "0.18"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

# Installers: `cargo packager --release` (https://github.com/crabnebula-dev/cargo-packager).
[package.metadata.packager]
product-name = "Zentop"
identifier = "com.zentop.app"
category = "Utility"
out-dir = "target/packager"
icons = [
  "assets/icons/32x32.png",
  "assets/icons/128x128.png",
  "assets/icons/128x128@2x.png",
  "assets/icons/icon.icns",
  "assets/icons/icon.ico",
]
formats = ["app", "dmg", "nsis", "deb", "appimage"]

[package.metadata.packager.macos]
minimum-system-version = "10.15"

# RPMs: `cargo generate-rpm` after a release build (cargo-packager has no RPM format).
[package.metadata.generate-rpm]
name = "zentop"
license = "MIT"
assets = [
  { source = "target/release/Zentop", dest = "/usr/bin/Zentop", mode = "755" },
  { source = "assets/zentop.desktop", dest = "/usr/share/applications/zentop.desktop", mode = "644" },
  { source = "assets/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/zentop.png", mode = "644" },
]
