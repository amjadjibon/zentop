[package]
name = "zentop-core"
description = "Shared system monitoring and sampling for Zentop frontends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
notifications = ["dep:notify-rust", "dep:objc2", "dep:objc2-foundation", "dep:objc2-user-notifications", "dep:block2"]

[dependencies]
serde_json.workspace = true
dirs = "6"
fs2 = "0.4"
chrono.workspace = true
regex.workspace = true
serde.workspace = true
sysinfo.workspace = true
listeners = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = { version = "0.6", features = ["exception"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"], optional = true }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger"], optional = true }
block2 = { version = "0.6", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Keep notification support compatible with the workspace's Rust 1.88 floor.
notify-rust = { version = "=4.11.7", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
