[package]
name = "zentop-proxy"
description = "Loopback HTTP traffic inspection and CONNECT tunnels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
brotli = "8"
bytes = "1"
flate2 = "1"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
idna = "1"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls-platform-verifier = { version = "0.7", default-features = false }
time = { version = "0.3", features = ["formatting"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"
security-framework-sys = "2.17"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
x509-parser = "0.18"
