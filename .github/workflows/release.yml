name: Draft Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: scripts/release.sh check-version "$RELEASE_TAG"
      - name: Refuse changes to a published release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) && [ "$draft" != "true" ]; then
            echo "::error::This version is already published. Create a new version and tag."
            exit 1
          fi

  packages:
    needs: preflight
    uses: ./.github/workflows/build-check.yml
    with:
      # Branch dispatches build preview artifacts. Tags build signed candidates.
      release: ${{ startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts
      - name: Verify packages, write checksums and create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release.sh upload-draft artifacts "$RELEASE_TAG"
