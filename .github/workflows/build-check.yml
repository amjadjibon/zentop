name: Build Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Require signed and notarized macOS release builds
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Source checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check
      - run: scripts/release-test.sh
      - run: scripts/release.sh check-version

  build:
    name: Package (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ inputs.release && 'release' || 'check' }}
          cache-on-failure: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libfuse2 file xdg-utils

      - name: Require macOS release credentials
        if: runner.os == 'macOS' && inputs.release
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release credential: $name"
              exit 1
            fi
          done

      - name: Install packaging tools
        shell: bash
        run: |
          cargo install --locked cargo-packager@0.11.8
          if [ "$RUNNER_OS" = "Linux" ]; then cargo install --locked cargo-generate-rpm; fi

      - name: Test Rust code
        # Intel macOS is cross-compiled on ARM; tests run in the ARM job.
        if: matrix.platform != 'macos-x86_64'
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Remove cached package outputs
        # Keep compiler caches, but never mix installers from different versions.
        shell: bash
        run: rm -rf target/packager "target/${{ matrix.target }}/generate-rpm"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build packages without Apple credentials
        if: runner.os != 'macOS' || !inputs.release
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.bundles }}

      - name: Build signed macOS release packages
        if: runner.os == 'macOS' && inputs.release
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: >-
            ${{ vars.APPLE_SIGNING_IDENTITY || 'Developer ID Application: Abdenasser Elidrissi (785JV74B9Y)' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Build only: release assets upload after every platform passes.
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.bundles }}

      - name: Build RPM package
        if: runner.os == 'Linux'
        run: |
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/generate-rpm/*.rpm target/packager/

      - name: Check AppImage display libraries
        if: runner.os == 'Linux'
        run: scripts/release.sh check-appimage target/packager

      - name: Verify macOS release signature and notarization
        if: runner.os == 'macOS' && inputs.release
        shell: bash
        env:
          BUNDLE_ROOT: target/packager
        run: |
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_ROOT/Zentop.app"
          xcrun stapler validate "$BUNDLE_ROOT/Zentop.app"

      - name: Stage and validate platform packages
        shell: bash
        run: scripts/release.sh stage ${{ matrix.platform }} target/packager artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
